services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookcafe-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DB_PATH=/app/data/bookcafe.db
      - JWT_SECRET=supersecret-bookcafe-token
      - ADMIN_KEY=akm-demo-key
    volumes:
      - bookcafe_data:/app/data
    networks:
      - bookcafe-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://95.182.117.246:4000/api
    container_name: bookcafe-frontend
    restart: unless-stopped
    ports:
      - "3009:3000"
      - "5173:3000"
    depends_on:
      - backend
    networks:
      - bookcafe-net

volumes:
  bookcafe_data:
    name: bookcafe_data

networks:
  bookcafe-net:
    driver: bridge
